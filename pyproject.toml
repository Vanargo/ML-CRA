[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-cra"
version = "0.1.0.dev0"
description = "Audit whether registered experimental evidence supports a bounded machine-learning claim."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "DATASET_ATTRIBUTION.md"]
authors = [
  { name = "Иван Полищук" },
]
keywords = ["machine-learning", "claim-audit", "reproducibility", "validation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema==4.26.0",
  "numpy==2.4.4",
  "pandas==3.0.2",
  "scikit-learn==1.8.0",
  "threadpoolctl==3.6.0",
]

[project.scripts]
mlcra = "mlcra.cli:main"

[project.optional-dependencies]
research-openml = [
  "openml==0.15.1",
]

[project.urls]
Repository = "https://github.com/Vanargo/ML-CRA"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.package-data]
mlcra = ["schemas/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlcra"]
namespaces = true
