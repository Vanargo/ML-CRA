name: ML-CRA assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-cra-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      MLCRA_ASSURANCE_INVENTORY: published
      SOURCE_DATE_EPOCH: "1787616000"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the declared Python cell
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          architecture: "x64"

      - name: Install hash-locked assurance tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/st08_09-assurance-tools-py312-windows-x86_64.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate source and immutable CI contract
        run: python scripts/st08_09_release_assurance.py source --inventory published

      - name: Install hash-locked runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/st08_07-py312-windows-x86_64.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install checked-out project without dependency resolution
        run: |
          python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Scan the public candidate for known secret patterns
        run: python scripts/st08_09_release_assurance.py secrets --inventory published

      - name: Audit known dependency vulnerabilities
        run: python scripts/st08_09_release_assurance.py dependencies --output-dir .tmp_st08_09_ci_audits

      - name: Run assurance mutation tests
        run: python -m unittest -v tests.test_release_assurance_st08_09

      - name: Validate bilingual documentation and current paths
        run: |
          python scripts/st08_10_documentation_assurance.py source --inventory published
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v tests.test_documentation_st08_10 tests.test_cli_st08_11 tests.test_dashboard_st08_12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate the registered Stage 8 release-candidate re-audit
        run: |
          python scripts/st08_13_release_candidate_reaudit.py --inventory published
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v tests.test_release_candidate_reaudit_st08_13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate the finite v1.0.0 exit contract
        run: |
          python scripts/st08_16_v1_0_0_exit_contract_assurance.py contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/st08_16_v1_0_0_exit_contract_assurance.py mutations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v tests.test_v1_0_0_exit_contract_st08_16
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/st08_16_v1_0_0_exit_contract_assurance.py final-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate the v1.0.0 candidate finalization
        run: |
          python scripts/st08_16A_v1_0_0_candidate_finalization_assurance.py contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/st08_16A_v1_0_0_candidate_finalization_assurance.py mutations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v tests.test_v1_0_0_candidate_finalization_st08_16A
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/st08_16A_v1_0_0_candidate_finalization_assurance.py final-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the exact v0.1.1 release assets twice
        run: python scripts/st08_15C_v0_1_1_GitHub_execution_assurance.py build-release --source lifecycle --output-dir dist/st08_15C-ci --verify-contract-assets

      - name: Reconstruct the exact published release commit twice
        run: python scripts/st08_14C_release_execution_assurance.py build-release --output-dir dist/st08_14C-ci

      - name: Validate sdist and wheel inventories
        run: |
          $sdist = Get-ChildItem -LiteralPath dist/st08_15C-ci -Filter *.tar.gz
          $wheel = Get-ChildItem -LiteralPath dist/st08_15C-ci -Filter *.whl
          if ($sdist.Count -ne 1 -or $wheel.Count -ne 1) { throw "Expected exactly one sdist and one wheel" }
          python scripts/st08_09_release_assurance.py archives --sdist $sdist.FullName --wheel $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify immutable releases and exact local assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release verify v0.1.0 --repo Vanargo/ML-CRA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release verify-asset v0.1.0 .\dist\st08_14C-ci\ml_cra-0.1.0.tar.gz --repo Vanargo/ML-CRA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release verify-asset v0.1.0 .\dist\st08_14C-ci\ml_cra-0.1.0-py3-none-any.whl --repo Vanargo/ML-CRA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release verify-asset v0.1.0 .\dist\st08_14C-ci\SHA256SUMS --repo Vanargo/ML-CRA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $state = (Get-Content -LiteralPath data_registry/st08_15C_v0_1_1_GitHub_execution_evidence_v01.json -Raw | ConvertFrom-Json).lifecycle_state
          $releasedStates = @("RELEASED_VERIFIED_PENDING_HOSTED_EVIDENCE_CLOSURE", "RELEASED_VERIFIED_AND_HOSTED_EVIDENCE_CLOSED")
          if ($releasedStates -contains $state) {
            gh release verify v0.1.1 --repo Vanargo/ML-CRA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release verify-asset v0.1.1 .\dist\st08_15C-ci\ml_cra-0.1.1.tar.gz --repo Vanargo/ML-CRA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release verify-asset v0.1.1 .\dist\st08_15C-ci\ml_cra-0.1.1-py3-none-any.whl --repo Vanargo/ML-CRA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release verify-asset v0.1.1 .\dist\st08_15C-ci\SHA256SUMS --repo Vanargo/ML-CRA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($state -ne "PREPARED_PENDING_EXACT_SHA_ASSURANCE_MERGE_AND_RELEASE") {
            throw "Unknown ST08_15C lifecycle state: $state"
          }

      - name: Prepare hash-verified runtime wheelhouse
        run: >-
          python -m pip download --dest .tmp_st08_09_ci_runtime_wheels
          -r requirements/locks/st08_07-py312-windows-x86_64.txt

      - name: Create clean runtime environment
        run: python -m venv .tmp_st08_09_ci_runtime

      - name: Install runtime dependencies and local wheel offline
        run: |
          .tmp_st08_09_ci_runtime\Scripts\python.exe -m pip install --no-index --find-links .tmp_st08_09_ci_runtime_wheels -r requirements/locks/st08_07-py312-windows-x86_64.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem -LiteralPath dist/st08_15C-ci -Filter *.whl
          .tmp_st08_09_ci_runtime\Scripts\python.exe -m pip install --no-index --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify clean install and CLI
        run: |
          .tmp_st08_09_ci_runtime\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .tmp_st08_09_ci_runtime\Scripts\mlcra.exe doctor --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .tmp_st08_09_ci_runtime\Scripts\python.exe -m unittest -v tests.test_cli_st08_08 tests.test_cli_st08_11 tests.test_dashboard_st08_12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .tmp_st08_09_ci_runtime\Scripts\python.exe scripts/st08_10_documentation_assurance.py walkthrough --mlcra .tmp_st08_09_ci_runtime\Scripts\mlcra.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run deterministic published baseline
        run: python scripts/agent_verify.py --mode baseline --inventory published
